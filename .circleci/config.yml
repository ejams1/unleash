version: 2.1

jobs:
  lint:
    docker:
      - image: koalaman/shellcheck-alpine:stable
    steps:
      - checkout
      - run:
          name: ShellCheck
          command: |
            apk add bash
            fail=0
            for f in unleash lib/*.sh examples/*.sh tests/smoke.sh; do
              [ -f "$f" ] || continue
              echo "Checking: $f"
              shellcheck -S warning "$f" || fail=1
            done
            exit "$fail"

  syntax:
    docker:
      - image: alpine:latest
    steps:
      - checkout
      - run:
          name: Bash syntax check
          command: |
            apk add bash
            fail=0
            for f in unleash unleash-standalone.sh lib/*.sh examples/*.sh tests/smoke.sh; do
              [ -f "$f" ] || continue
              echo "Checking: $f"
              bash -n "$f" || fail=1
            done
            exit "$fail"

  smoke:
    docker:
      - image: alpine:latest
    steps:
      - checkout
      - run:
          name: Smoke tests
          command: |
            apk add bash python3
            bash tests/smoke.sh

  markdown:
    docker:
      - image: alpine:latest
    steps:
      - checkout
      - run:
          name: Markdown Lint
          command: |
            apk add npm
            npm install -g markdownlint-cli
            markdownlint '*.md' || true

workflows:
  version: 2
  ci:
    jobs:
      - lint
      - syntax
      - smoke
      - markdown
